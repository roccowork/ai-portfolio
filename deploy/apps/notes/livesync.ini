; CouchDB 配置：给 Obsidian 的 Self-hosted LiveSync 插件用（设置项来自插件文档）。
; 管理员账号由环境变量 COUCHDB_USER / COUCHDB_PASSWORD 传入（Secret couchdb），不写在这里。
; uuid 固定下来：容器重建后不变，客户端的同步进度不用从头算
[couchdb]
single_node = true
max_document_size = 50000000
uuid = 6f1c2a9e0d3b4c5a8e7f9a1b2c3d4e5f

[cluster]
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
