# 按路径决定缓存策略：Astro 输出到 /_astro/ 的文件名带内容哈希，可以长期缓存；
# 其余（HTML 等）每次都向服务器确认，保证发布后立即生效。
# 用 map 而不是在 location 里写 add_header：nginx 的 location 一旦有 add_header，
# 就会丢掉外层的全部 add_header，安全头会悄悄消失。
map $uri $cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# 名片页 liuxd.dev 读取 /status.json 显示平台状态，只对这一个文件、这一个来源放开跨域
map $uri $cors_origin {
    /status.json  "https://liuxd.dev";
    default       "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # 目录跳转时不要把容器内的 8080 端口拼进 Location
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Access-Control-Allow-Origin $cors_origin always;

    # 探针专用，不写访问日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 企业服务页已迁到独立站点，旧链接永久跳转过去
    location ~ ^/service/?$ {
        return 301 https://it.liuxd.dev/;
    }

    # ChatBI 演示从 /ai/chatbi/ 挪到了 /chatbi/。正则 location 按书写顺序匹配，必须写在下面那条前面
    location ~ ^/ai/chatbi/?$ {
        return 301 /chatbi/;
    }

    # 2026-10 改版时下线的案例库、AI 演示、配置生成器和架构页，旧链接跳回首页（保留到 2027-06）。
    # /live/ 在改成作品集时恢复了，不再跳转
    location ~ ^/(c|cmd|runbooks|analyze|tools|favorites|cases|ai|generate|architecture|datacenter)(/|$) {
        return 301 /;
    }

    # 平台实况的数据：由 CronJob 每 10 分钟写进 ConfigMap，挂载到这里（deploy/k8s/base/status.yaml）
    location = /status.json {
        alias /usr/share/nginx/status/status.json;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
