# Dify 自定义工具：清源净水（虚构公司）的查订单、预约上门。
# 用法：Dify →「工具」→「自定义」→「创建自定义工具」，把这个文件的全部内容粘贴到 Schema 里；
# 鉴权方法选「API Key」，位置「请求头」，键 X-Demo-Token，值填 Secret ai-api 里的 DEMO_TOOL_TOKEN。
openapi: 3.1.0
info:
  title: 清源净水客服工具
  description: 演示用的虚构公司后台：查询订单状态、预约师傅上门
  version: 1.0.0
servers:
  - url: https://ops.liuxd.dev
paths:
  /api/ai/demo/order:
    get:
      operationId: queryOrder
      summary: 按订单号查询订单状态、物流和安装安排
      parameters:
        - name: order_id
          in: query
          required: true
          description: 订单号，如 QY1001
          schema:
            type: string
      responses:
        '200':
          description: 订单信息；found 为 false 表示没有这个订单
  /api/ai/demo/booking:
    post:
      operationId: bookVisit
      summary: 预约师傅上门安装、维修或更换滤芯。调用前必须向用户问清姓名、电话、地址和时间
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, address, time]
              properties:
                name:
                  type: string
                  description: 联系人称呼
                phone:
                  type: string
                  description: 联系电话
                address:
                  type: string
                  description: 上门地址
                time:
                  type: string
                  description: 希望上门的时间，如「明天下午」
                service:
                  type: string
                  description: 服务类型：上门安装、维修、更换滤芯
      responses:
        '200':
          description: 预约成功，返回预约号
