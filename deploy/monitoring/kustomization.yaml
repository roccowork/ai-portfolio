apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 每个资源都写明了自己的命名空间（Traefik 的指标 Service 在 kube-system），这里不统一覆盖
resources:
  - namespace.yaml
  - middleware.yaml
  - weekly-report.yaml
  - daily-english.yaml
  - r2-usage.yaml
  - traefik-metrics.yaml
  - ai-metrics.yaml
  - blackbox.yaml
  - prometheus-public.yaml
  - rules/ops-desk.yaml
configMapGenerator:
  # 脚本内容变化时 ConfigMap 名字的哈希后缀会变，Deployment 随之滚动更新
  # 周报用 scripts/telegram.mjs 的发送函数，所以两个文件放在同一个 ConfigMap 里
  - name: weekly-report
    namespace: monitoring
    files:
      - scripts/weekly-report.mjs
      - scripts/telegram.mjs
  # 每日运维英语，同样复用发送函数
  - name: daily-english
    namespace: monitoring
    files:
      - scripts/daily-english.mjs
      - scripts/words.json
      - scripts/telegram.mjs
  # R2 用量报告，同样复用发送函数
  - name: r2-usage
    namespace: monitoring
    files:
      - scripts/r2-usage.mjs
      - scripts/telegram.mjs
  # Blackbox Exporter 的模块配置（改了自动重启加载，见 blackbox.yaml 开头）
  - name: blackbox-exporter
    namespace: monitoring
    files:
      - blackbox/blackbox.yml
  # 仪表盘：Grafana 的 sidecar 会自动加载带 grafana_dashboard=1 标签的 ConfigMap
  - name: grafana-dashboards-ops-desk
    namespace: monitoring
    files:
      - dashboards/ops-desk-overview.json
    options:
      labels:
        grafana_dashboard: '1'
