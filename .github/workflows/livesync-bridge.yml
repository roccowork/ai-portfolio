name: livesync-bridge 镜像

# 只在改了 Dockerfile（换上游提交）时构建；镜像标签用上游提交的前 7 位，清单里直接写死，不用 CI 回写
on:
  push:
    branches: [main]
    paths: ['deploy/docker/livesync-bridge.Dockerfile', '.github/workflows/livesync-bridge.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 取上游提交
        id: ref
        run: |
          sha=$(grep -oE 'livesync-bridge\.git#[0-9a-f]{40}' deploy/docker/livesync-bridge.Dockerfile | cut -d'#' -f2)
          echo "tag=${sha::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/docker/livesync-bridge.Dockerfile
          push: true
          tags: ghcr.io/roccowork/livesync-bridge:${{ steps.ref.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/roccowork/ai-portfolio
