# Blackbox Exporter：从服务器向外发请求，记录通不通、多快、证书还剩几天（probe_success、probe_duration_seconds、
# probe_ssl_earliest_cert_expiry）。2026-11-22 起是唯一的可用性监控（Uptime Kuma 停用，监控只留一套）。探测三类目标，标签 group 区分：
# - own：自己的网站。ops、grafana、argocd 在这台服务器上（dify 2026-11 停用，不再拨测）；liuxd.dev、cv、roadmap、ai-roadmap、it 托管在 Cloudflare Pages，挂了集群内部看不出来
# - dependency：本站依赖的外部服务。AI 变慢、发不出告警时，用来分清是自己的问题还是对方的问题
# - vps：私人的 VPS 节点端口（TCP），Probe 和告警写在私有仓库（地址不进公开仓库），用下面的 tcp_connect 模块
# 模块配置在 blackbox/blackbox.yml（kustomization.yaml 的 configMapGenerator 生成 ConfigMap：内容变了名字的哈希后缀跟着变，Deployment 自动重启加载。
# 2026-11-22 踩坑：原来是普通 ConfigMap，加了 tcp_connect 模块但 Pod 没重启、读不到，VPS 检测全部失败报 TargetDown，VPSDown 反而发不出来）
# 探测目标写在下面两个 Probe 里，Prometheus 每分钟探测一次。运维 Agent 用 promql 工具就能查到这些指标
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          args: ['--config.file=/config/blackbox.yml']
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
# 自己的网站。name 标签是给人看的名字，值班台、大屏和告警里显示它
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: own-sites
  namespace: monitoring
spec:
  jobName: probe-own
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        group: own
      static:
        - https://ops.liuxd.dev/
        - https://liuxd.dev/
        - https://cv.liuxd.dev/
        - https://roadmap.liuxd.dev/
        - https://ai-roadmap.liuxd.dev/
        - https://it.liuxd.dev/
        # 运维后台：Grafana、Argo CD（登录页能打开就算正常）
        - https://grafana.liuxd.dev/
        - https://argocd.liuxd.dev/
        # LabPager App 的推送中转
        - https://push.liuxd.dev/healthz
        # 访问统计 Umami（登录页能打开就算正常）
        - https://stats.liuxd.dev/
      relabelingConfigs:
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://([^/]+)/?
          replacement: $1
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://([^/]+)/healthz
          replacement: $1
---
# 自己的、要登录的接口：Prometheus 外网入口（LabPager 用，基本认证），不带密码返回 401 也算在线。2026-11-22 补上（之前漏了）
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: own-auth
  namespace: monitoring
spec:
  jobName: probe-own-auth
  interval: 60s
  module: http_reachable
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        group: own
      static:
        - https://prometheus.liuxd.dev/api/v1/status/buildinfo
      relabelingConfigs:
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://([^/]+)/.*
          replacement: $1
---
# 本站依赖的外部服务
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dependencies
  namespace: monitoring
spec:
  jobName: probe-dependency
  interval: 60s
  module: http_reachable
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        group: dependency
      static:
        # 阿里云百炼（大模型），不带密钥返回 401
        - https://dashscope-intl.aliyuncs.com/compatible-mode/v1/models
        # GitHub（代码、CI）和 GHCR（镜像），GHCR 不带密钥返回 401。
        # GitHub 测 api.github.com，不测首页：首页很大，从香港握手 0.05 秒但下载要 5～15 秒，经常撞上 10 秒超时（2026-11-06 误报）；api 0.1～0.5 秒
        - https://api.github.com/
        - https://ghcr.io/v2/
        # Cloudflare（R2 备份、Pages 网站、DNS）
        - https://api.cloudflare.com/client/v4/
        # Telegram（告警和机器人）
        - https://api.telegram.org/
      relabelingConfigs:
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://dashscope.*
          replacement: 阿里云百炼
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://api.github.com/
          replacement: GitHub
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://ghcr.io/.*
          replacement: GHCR 镜像仓库
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://api.cloudflare.com/.*
          replacement: Cloudflare
        - sourceLabels: [__param_target]
          targetLabel: name
          regex: https://api.telegram.org/
          replacement: Telegram
