apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 命名空间由 Argo CD 创建（deploy/argocd/applications.yaml 里的 CreateNamespace=true）
namespace: secret-backup
resources:
  - backup.yaml
components:
  - ../../backup
configMapGenerator:
  - name: secret-export-script
    files:
      - export.mjs
    options:
      disableNameSuffixHash: true
