# k3s 自带的 Traefik 已在 9100 端口暴露 Prometheus 指标，但没有对应的 Service，Prometheus 找不到它。
# 这里补一个只暴露指标端口的 Service（在 kube-system），再用 ServiceMonitor 让 Prometheus 采集。
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik-metrics
spec:
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-metrics
  endpoints:
    - port: metrics
      interval: 30s
      # Traefik 自己的 service 标签（如 ops-desk-ops-desk-http@kubernetes）和采集时自动加的 service 标签重名，
      # 默认会被改名为 exported_service；这里保留 Traefik 原本的标签，查询更直观
      honorLabels: true
