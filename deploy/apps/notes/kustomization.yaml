apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 命名空间由 Argo CD 创建（deploy/argocd/applications.yaml 里的 CreateNamespace=true）
namespace: notes
resources:
  - couchdb.yaml
  - backup.yaml
  - bridge.yaml
  - mcp.yaml
components:
  - ../../backup
configMapGenerator:
  - name: couchdb-config
    files:
      - livesync.ini
  - name: brain-mcp-script
    files:
      - mcp.mjs
