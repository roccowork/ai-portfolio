# n8n 工作流平台（SPEC 里程碑 9），地址 n8n.liuxd.dev。用网页拖拽搭自动化流程：表单、定时任务、Webhook、调用各种 API。
# 数据（工作流、凭据、执行记录）在一个 SQLite 文件里，每天由 backup.yaml 备份到 R2；
# 加密凭据用的密钥在同一目录的 config 文件里，一起备份，恢复后凭据仍可解密。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  annotations:
    # Argo CD 开了 prune：万一清单里删掉了这个 PVC，也不要连带删掉（local-path 删 PVC 就删数据）
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  # 暂不运行（2026-10-24 决定先作为案例展示，节省服务器内存）；要用时改成 1，并按 runbook 第 11 节建 Secret
  replicas: 0
  # SQLite 同一时间只能有一个实例写，所以先停旧的再起新的
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      automountServiceAccountToken: false
      # 不注入 Service 环境变量：n8n 会把 N8N_ 开头的变量当配置读，同名的 N8N_PORT=tcp://... 会让它启动失败
      enableServiceLinks: false
      # 镜像自带的 node 用户；备份任务用同一个用户，才能读到数据库
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: n8nio/n8n:2.44.6
          env:
            - { name: N8N_HOST, value: n8n.liuxd.dev }
            - { name: N8N_PROTOCOL, value: https }
            - { name: N8N_PORT, value: '5678' }
            # 表单和 Webhook 对外显示的地址（TLS 由 Traefik 终止，Pod 里只跑 HTTP）
            - { name: WEBHOOK_URL, value: 'https://n8n.liuxd.dev/' }
            # 前面有一层 Traefik，按 X-Forwarded-For 取访客 IP
            - { name: N8N_PROXY_HOPS, value: '1' }
            - { name: GENERIC_TIMEZONE, value: America/Los_Angeles }
            - { name: TZ, value: America/Los_Angeles }
            - { name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: 'true' }
            # 不上报使用数据、不检查新版本（版本由 Renovate 提 PR 升级）
            - { name: N8N_DIAGNOSTICS_ENABLED, value: 'false' }
            - { name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: 'false' }
            # 执行记录只保留 14 天，避免数据库越来越大
            - { name: EXECUTIONS_DATA_PRUNE, value: 'true' }
            - { name: EXECUTIONS_DATA_MAX_AGE, value: '336' }
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            # 第一次启动要初始化数据库，给足时间
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            # n8n 运行时会在家目录和 /tmp 之外写缓存，根文件系统保持可写
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
---
# HTTP 跳转 HTTPS。Traefik 默认不允许跨命名空间引用中间件，每个命名空间单独建一个
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# 管理界面外面再加一层 HTTP 基本认证：n8n 第一次打开时谁先访问谁就能注册管理员，
# 有了这一层，上线后到你注册之间也不会被别人抢先。Secret n8n-basic-auth 由人在服务器上创建（docs/runbook.md「n8n」），
# Secret 不存在时 Traefik 拒绝访问，默认是安全的。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: n8n-basic-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: n8n-redirect-https@kubernetescrd,n8n-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [n8n.liuxd.dev]
      secretName: n8n-tls
  rules:
    - host: n8n.liuxd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  name: http
---
# 对外的表单和 Webhook 不加基本认证（访客和外部系统要能直接访问）；路径更长，Traefik 优先匹配这一条
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-public
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: n8n-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [n8n.liuxd.dev]
      secretName: n8n-tls
  rules:
    - host: n8n.liuxd.dev
      http:
        paths:
          - path: /webhook/
            pathType: Prefix
            backend:
              service: { name: n8n, port: { name: http } }
          - path: /form/
            pathType: Prefix
            backend:
              service: { name: n8n, port: { name: http } }
