# 每天把 n8n 的数据（SQLite 数据库 + 加密密钥 config）加密备份到 Cloudflare R2，写法和 GoatCounter 的备份相同。
# 需要先手动创建 Secret backup-r2（步骤见 docs/runbook.md 第 10 节），密钥不进仓库。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-n8n
spec:
  # n8n 暂不运行，备份也先停掉；启用 n8n 时删掉这一行
  suspend: true
  schedule: '50 4 * * *'
  timeZone: Asia/Singapore
  # 上一次还没跑完就跳过这一次，避免两个任务同时操作同一个 restic 仓库
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      # 结束一天后删除 Job：失败告警看的是失败的 Job，删掉后告警自动恢复
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # 和 n8n 用同一个用户，才能读到它创建的文件
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: node:24.21.0-alpine
              command:
                [node, /scripts/snapshot.mjs, /data/database.sqlite, /snapshot/database.sqlite]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                # 读 WAL 模式的数据库需要写共享内存文件（.db-shm），所以这里不能只读挂载
                - { name: data, mountPath: /data }
                - { name: snapshot, mountPath: /snapshot }
                - { name: scripts, mountPath: /scripts }
          containers:
            - name: restic
              image: restic/restic:0.19.1
              command: [sh, /scripts/backup.sh]
              env:
                - name: BACKUP_HOST
                  value: n8n
                # n8n 的数据库叫 database.sqlite，正在使用的文件不直接备份，用 /snapshot 里的一致性副本代替
                - name: BACKUP_EXCLUDES
                  value: /data/database.sqlite /data/database.sqlite-wal /data/database.sqlite-shm /data/database.sqlite-journal
                # R2 的区域固定为 auto
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: backup-r2
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 1000m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: snapshot, mountPath: /snapshot, readOnly: true }
                - { name: scripts, mountPath: /scripts }
                - { name: cache, mountPath: /cache }
          volumes:
            # 和正在运行的 n8n 挂同一个卷：同一节点上的多个 Pod 可以同时挂载 ReadWriteOnce 卷
            - name: data
              persistentVolumeClaim:
                claimName: n8n-data
            - name: snapshot
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: scripts
              configMap:
                name: backup-scripts
