name: CI

# 只改文档不跑；同一个 PR 推了新提交就取消旧的运行（公开仓库的 Actions 不限分钟，这些设置是拆分前私有仓库省额度时留下的，留着也不碍事）
on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/roccowork/ops-desk
  AI_IMAGE: ghcr.io/roccowork/ops-desk-ai

jobs:
  # PR 和 main 都跑：任何一项失败，后面的镜像构建和部署都不会执行，线上不受影响
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # AI 服务的单元测试：用假的模型服务，不需要密钥、不产生费用
  ai-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # 构建镜像和提交新标签合成一个 job（拆分前私有仓库按 job 计费时这样省时间，现在也少一次排队）。
  # GitOps：CI 不访问集群，只把新镜像标签写进 Git；集群里的 Argo CD 发现变化后自动同步。
  # 不在 CI 里等上线：上线后的可用性由 Uptime Kuma 和告警盯着
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, ai-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # 提交镜像标签
      packages: write
    # 同一时间只允许一个发布，后来的排队，不取消正在进行的
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # 只改了 deploy/（K8s 清单、监控、平台组件）时不用重新构建镜像：Argo CD 直接同步清单就行
      - name: 是否需要构建镜像
        id: changes
        run: |
          base='${{ github.event.before }}'
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" HEAD)
          else
            files=$(git ls-files)
          fi
          echo "$files"
          # deploy/docker/ 是 Dockerfile，改了要重新构建
          if echo "$files" | grep -qvE '^(deploy/|docs/|[^/]*\.md$)' || echo "$files" | grep -qE '^deploy/docker/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "只改了清单或文档，跳过构建"
          fi

      - if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4.4.1
      - if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          # 用 commit SHA 做标签：每个线上版本都能对应到一次提交，不依赖 latest
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/docker/ai.Dockerfile
          push: true
          tags: ${{ env.AI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: 更新镜像标签并提交
        if: steps.changes.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 提交信息带 [skip ci]，否则这次提交又会触发流水线，形成死循环。
          # 期间如果有人推送了新提交，推送会被拒绝：拉取最新代码后重试
          for i in 1 2 3; do
            git pull --rebase --quiet origin main
            sed -i "s/^    newTag: .*/    newTag: ${GITHUB_SHA}/" deploy/k8s/overlays/prod/kustomization.yaml
            if git diff --quiet; then echo "镜像标签已经是 ${GITHUB_SHA}"; exit 0; fi
            git commit -qam "deploy: ops-desk ${GITHUB_SHA::7} [skip ci]"
            if git push --quiet origin HEAD:main; then echo "已提交新镜像标签"; exit 0; fi
            git reset --quiet --hard origin/main
          done
          echo "::error::提交镜像标签失败"; exit 1
